<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Άσκηση 02 — ΥΚ1, Κτίριο Γ΄ | Υφές και φωτισμός</title>
  <meta name="description" content="Εμπλουτισμός της σκηνής του ΥΚ1 με υφές (materials & shaders) και πειραματισμός με τον φωτισμό σε A-Frame.">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="js/scene.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="hud">
    <b>ΥΚ1 · Υφές &amp; φωτισμός</b>
    <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> μετακίνηση<br>
    Ποντίκι / drag: περιστροφή βλέμματος<br>
    Κουμπί <kbd>VR</kbd> κάτω δεξιά για προβολή σε headset<br>
    <button id="preset-button"><kbd>L</kbd> φωτισμός: <span id="preset-label">μέρα</span> &#8635;</button>
  </div>

  <a-scene lighting-presets
           light="defaultLightsEnabled: false"
           shadow="type: pcf"
           renderer="antialias: true; colorManagement: true; toneMapping: ACESFilmic; exposure: 0.85">

    <a-assets>
      <img id="texFloor"     src="assets/avarts_floor_tiles.jpg">
      <img id="texWall"      src="assets/avarts_wall_white.jpg">
      <img id="texWallN"     src="assets/wall_normal.png">
      <img id="texCeiling"   src="assets/lab_plaster.jpg">
      <img id="texDesk"      src="assets/desk_laminate.png">
      <img id="texWood"      src="assets/lab_wood.jpg">
      <img id="texDoor"      src="assets/avarts_door.jpg">
      <img id="texFabric"    src="assets/curtain_fabric.png">
      <img id="texMetal"     src="assets/lab_metal.jpg">
      <img id="texScreen"    src="assets/screen_desktop.png">
      <img id="texCode"      src="assets/screen_code.png">
      <img id="texPhoto"     src="assets/screen_photo.png">
      <img id="texKeyboard"  src="assets/keyboard.png">
      <img id="texChair"     src="assets/chair_fabric.png">
      <img id="texRadiator"  src="assets/radiator_fins.png">
      <img id="texSign"      src="assets/door_sign.png">
      <img id="texGrass"     src="assets/grass.png">
      <img id="texSky"       src="assets/sky_clouds.png">
      <img id="texView"      src="assets/view_outside.jpg">
      <img id="texPosterA"   src="assets/poster_a.jpg">
      <img id="texPosterB"   src="assets/poster_b.jpg">
      <img id="texPlastic"   src="assets/plastic_dark.png">
      <img id="texPCFront"   src="assets/pc_front.png">
      <img id="texGlass"     src="assets/glass_pane.png">
      <img id="texAlu"       src="assets/frame_alu.png">
      <img id="texProjector" src="assets/screen_fabric.png">
      <img id="texLamp"      src="assets/lamp_diffuser.png">
      <img id="texLouvre"    src="assets/ac_louvre.png">

      <video id="texVideo" src="assets/screen_video.mp4" autoplay loop muted playsinline></video>

      <!-- Υλικά της σκηνής -->
      <a-mixin id="m-wall"     material="src: #texWall; color: #e4e1da; normalMap: #texWallN; normalTextureRepeat: 3 1.5; repeat: 3 1.5; roughness: 0.95; metalness: 0"></a-mixin>
      <a-mixin id="m-floor"    material="src: #texFloor; color: #cfc9bd; repeat: 9 8; roughness: 0.45; metalness: 0.1"></a-mixin>
      <a-mixin id="m-ceiling"  material="src: #texCeiling; color: #eeece7; repeat: 4 3; roughness: 1"></a-mixin>
      <a-mixin id="m-skirt"    material="color: #ada695; roughness: 0.7"></a-mixin>
      <a-mixin id="m-door"     material="src: #texDoor; roughness: 0.55"></a-mixin>
      <a-mixin id="m-wood"     material="src: #texWood; roughness: 0.7"></a-mixin>
      <!-- Δύο εκδοχές του ίδιου πάγκου: αλλάζει μόνο η φορά του repeat, ώστε
           η υφή να μην τεντώνεται στους πάγκους κατά τον άξονα Z. -->
      <a-mixin id="m-desk-x"   material="src: #texDesk; color: #cdc3ab; repeat: 6 1; roughness: 0.65"></a-mixin>
      <a-mixin id="m-desk-z"   material="src: #texDesk; color: #cdc3ab; repeat: 1 5; roughness: 0.65"></a-mixin>
      <a-mixin id="m-metal"    material="src: #texMetal; color: #b4bcc4; roughness: 0.4; metalness: 0.75"></a-mixin>
      <a-mixin id="m-tube"     material="color: #23262a; roughness: 0.45; metalness: 0.6"></a-mixin>
      <a-mixin id="m-plastic"  material="src: #texPlastic; roughness: 0.65"></a-mixin>
      <a-mixin id="m-pc"       material="src: #texPCFront; roughness: 0.6"></a-mixin>
      <a-mixin id="m-chair"    material="src: #texChair; repeat: 2 2; roughness: 0.95"></a-mixin>
      <a-mixin id="m-keyboard" material="src: #texKeyboard; roughness: 0.7"></a-mixin>
      <a-mixin id="m-radiator" material="src: #texRadiator; repeat: 1 2; roughness: 0.55; metalness: 0.15"></a-mixin>
      <a-mixin id="m-curtain"  material="src: #texFabric; color: #d3b985; repeat: 1 3; roughness: 1"></a-mixin>
      <a-mixin id="m-glass"    material="src: #texGlass; opacity: 0.4; transparent: true; roughness: 0.05; metalness: 0.3"></a-mixin>
      <a-mixin id="m-frame"    material="src: #texAlu; color: #c8ced4; roughness: 0.45; metalness: 0.25"></a-mixin>
      <a-mixin id="m-white"    material="color: #ebe9e3; roughness: 0.22; metalness: 0.05"></a-mixin>
      <a-mixin id="m-louvre"   material="src: #texLouvre; roughness: 0.55"></a-mixin>
      <a-mixin id="m-lamp"     material="src: #texLamp; emissive: #fdfbe8; emissiveIntensity: 0.4; roughness: 0.3"></a-mixin>
      <a-mixin id="m-poster"   material="src: #texPosterA; roughness: 0.9"></a-mixin>
      <a-mixin id="m-poster2"  material="src: #texPosterB; roughness: 0.9"></a-mixin>

      <!-- shader: flat για ό,τι φωτίζεται μόνο του (οθόνες, πινακίδες, θέα) -->
      <a-mixin id="m-screen"   material="src: #texScreen; shader: flat"></a-mixin>
      <a-mixin id="m-code"     material="src: #texCode; shader: flat"></a-mixin>
      <a-mixin id="m-photo"    material="src: #texPhoto; shader: flat"></a-mixin>
      <a-mixin id="m-video"    material="src: #texVideo; shader: flat"></a-mixin>
      <a-mixin id="m-sign"     material="src: #texSign; shader: flat"></a-mixin>
      <a-mixin id="m-view"     material="src: #texView; shader: flat"></a-mixin>

      <!-- shader: phong για το γυαλιστερό χρώμιο -->
      <a-mixin id="m-chrome"   material="shader: phong; color: #b9c0c7; specular: #ffffff; shininess: 90; reflectivity: 0.8"></a-mixin>
    </a-assets>

    <!-- ============ ΦΩΤΙΣΜΟΣ ============ -->
    <a-entity id="ambient" light="type: ambient; color: #ccd6e2; intensity: 0.22"></a-entity>
    <a-entity id="hemi" light="type: hemisphere; color: #eef2f6; groundColor: #a49a84; intensity: 0.18"></a-entity>

    <!-- Ήλιος: κατευθυντικό φως από την πλευρά των παραθύρων, με σκιές. -->
    <a-entity id="sun"
              light="type: directional; color: #fff2d4; intensity: 0.85; castShadow: true;
                     shadowMapWidth: 2048; shadowMapHeight: 2048; shadowBias: -0.0006;
                     shadowCameraLeft: -6; shadowCameraRight: 6;
                     shadowCameraTop: 6; shadowCameraBottom: -6"
              position="8 4.5 1.5"></a-entity>

    <!-- Φωτιστικά οροφής -->
    <a-entity class="lamp" light="type: point; color: #eaf0fb; intensity: 9; distance: 7; decay: 1" position="-1.7 2.42 -1.2"></a-entity>
    <a-entity class="lamp" light="type: point; color: #eaf0fb; intensity: 9; distance: 7; decay: 1" position="0.5 2.42 1.1"></a-entity>
    <a-entity class="lamp" light="type: point; color: #eaf0fb; intensity: 7.3; distance: 7; decay: 1" position="2.4 2.42 -1.2"></a-entity>

    <!-- Προβολέας: σποτ που στοχεύει στο πανί προβολής -->
    <a-entity id="projector-target" position="0.7 1.75 -2.98"></a-entity>
    <a-entity id="projector-beam"
              light="type: spot; color: #eaf1ff; intensity: 28; angle: 31; penumbra: 0.45;
                     distance: 6; decay: 1; target: #projector-target"
              position="0.7 2.45 -1.3"></a-entity>

    <!-- ============ ΑΙΘΟΥΣΑ (7 x 6 x 2.9 m) ============ -->
    <a-plane mixin="m-floor" position="0 0 0" rotation="-90 0 0" width="7" height="6" shadow="receive: true"></a-plane>
    <a-box mixin="m-ceiling" position="0 2.95 0" width="7" height="0.1" depth="6" shadow="cast: true; receive: true"></a-box>

    <!-- Σοβατεπί -->
    <a-box mixin="m-skirt" position="0 0.05 2.98" width="7" height="0.1" depth="0.03"></a-box>
    <a-box mixin="m-skirt" position="-3.48 0.05 0" width="0.03" height="0.1" depth="6"></a-box>
    <a-box mixin="m-skirt" position="3.48 0.05 0" width="0.03" height="0.1" depth="6"></a-box>
    <a-box mixin="m-skirt" position="-3.35 0.05 -2.98" width="0.3" height="0.1" depth="0.03"></a-box>
    <a-box mixin="m-skirt" position="0.7 0.05 -2.98" width="5.6" height="0.1" depth="0.03"></a-box>

    <!-- Πίσω και αριστερός τοίχος, συμπαγείς -->
    <a-box mixin="m-wall" position="0 1.45 3.08" width="7.2" height="2.9" depth="0.15" shadow="cast: true; receive: true"></a-box>
    <a-box mixin="m-wall" position="-3.58 1.45 0" width="0.15" height="2.9" depth="6.2" shadow="cast: true; receive: true"></a-box>

    <!-- Μπροστινός τοίχος: δύο κομμάτια και ένα υπέρθυρο, για να μείνει το άνοιγμα της πόρτας -->
    <a-box mixin="m-wall" position="-3.39 1.45 -3.08" width="0.38" height="2.9" depth="0.15" shadow="cast: true; receive: true"></a-box>
    <a-box mixin="m-wall" position="0.74 1.45 -3.08" width="5.68" height="2.9" depth="0.15" shadow="cast: true; receive: true"></a-box>
    <a-box mixin="m-wall" position="-2.65 2.83 -3.08" width="1.1" height="0.15" depth="0.15" shadow="cast: true; receive: true"></a-box>

    <a-plane mixin="m-door" position="-2.65 1.38 -2.99" width="1.1" height="2.76"></a-plane>
    <a-box mixin="m-frame" position="-2.65 2.76 -2.97" width="1.2" height="0.06" depth="0.05"></a-box>
    <a-box mixin="m-frame" position="-3.23 1.38 -2.97" width="0.06" height="2.76" depth="0.05"></a-box>
    <a-box mixin="m-frame" position="-2.07 1.38 -2.97" width="0.06" height="2.76" depth="0.05"></a-box>

    <!-- Δεξιός τοίχος: σπασμένος σε κομμάτια γύρω από τα δύο παράθυρα -->
    <a-box mixin="m-wall" position="3.58 0.5 0" width="0.15" height="1.0" depth="6.2" shadow="cast: true; receive: true"></a-box>
    <a-box mixin="m-wall" position="3.58 2.6 0" width="0.15" height="0.6" depth="6.2" shadow="cast: true; receive: true"></a-box>
    <a-box mixin="m-wall" position="3.58 1.65 -2.55" width="0.15" height="1.3" depth="0.9" shadow="cast: true; receive: true"></a-box>
    <a-box mixin="m-wall" position="3.58 1.65 0" width="0.15" height="1.3" depth="1.4" shadow="cast: true; receive: true"></a-box>
    <a-box mixin="m-wall" position="3.58 1.65 2.55" width="0.15" height="1.3" depth="0.9" shadow="cast: true; receive: true"></a-box>

    <!-- Τζάμια, κάσες και ποδιά παραθύρου -->
    <a-plane mixin="m-glass" position="3.5 1.65 -1.4" rotation="0 -90 0" width="1.4" height="1.3" shadow="cast: false"></a-plane>
    <a-plane mixin="m-glass" position="3.5 1.65 1.4"  rotation="0 -90 0" width="1.4" height="1.3" shadow="cast: false"></a-plane>
    <a-box mixin="m-frame" position="3.52 1.65 -1.4" width="0.05" height="1.3" depth="0.06"></a-box>
    <a-box mixin="m-frame" position="3.52 1.65 1.4"  width="0.05" height="1.3" depth="0.06"></a-box>
    <a-box mixin="m-frame" position="3.52 2.3 -1.4" width="0.05" height="0.06" depth="1.4"></a-box>
    <a-box mixin="m-frame" position="3.52 2.3 1.4"  width="0.05" height="0.06" depth="1.4"></a-box>
    <a-box mixin="m-wall" position="3.4 1.0 0" width="0.32" height="0.06" depth="6" shadow="cast: true; receive: true"></a-box>

    <!-- Κουρτινόξυλο, κουρτίνες και κρίκοι -->
    <a-cylinder mixin="m-chrome" position="3.34 2.48 0" rotation="90 0 0" radius="0.014" height="5.7"></a-cylinder>
    <a-box mixin="m-curtain" position="3.37 1.73 -2.15" width="0.11" height="1.45" depth="0.5" shadow="cast: true"></a-box>
    <a-box mixin="m-curtain" position="3.37 1.73 -0.72" width="0.11" height="1.45" depth="0.5" shadow="cast: true"></a-box>
    <a-box mixin="m-curtain" position="3.37 1.73 0.72" width="0.11" height="1.45" depth="0.5" shadow="cast: true"></a-box>
    <a-box mixin="m-curtain" position="3.37 1.73 2.15" width="0.11" height="1.45" depth="0.5" shadow="cast: true"></a-box>
    <a-torus mixin="m-frame" position="3.34 2.46 -2.34" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 -2.15" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 -1.96" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 -0.91" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 -0.72" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 -0.53" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 0.53" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 0.72" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 0.91" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 1.96" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 2.15" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>
    <a-torus mixin="m-frame" position="3.34 2.46 2.34" rotation="0 90 0" radius="0.028" radius-tubular="0.006"></a-torus>

    <!-- Θερμαντικό σώμα -->
    <a-box mixin="m-radiator" position="3.44 1.4 0" width="0.1" height="0.6" depth="0.9" shadow="cast: true"></a-box>
    <a-box mixin="m-metal" position="3.48 1.03 0" width="0.03" height="0.1" depth="0.06"></a-box>

    <!-- Κλιματιστικά -->
    <a-box mixin="m-white" position="1.6 2.52 -2.9" width="0.85" height="0.28" depth="0.22" shadow="cast: true"></a-box>
    <a-box mixin="m-louvre" position="1.6 2.38 -2.85" width="0.75" height="0.06" depth="0.17"></a-box>
    <a-box mixin="m-white" position="3.4 2.52 2.3" width="0.22" height="0.28" depth="0.85" shadow="cast: true"></a-box>
    <a-box mixin="m-louvre" position="3.37 2.38 2.3" width="0.17" height="0.06" depth="0.75"></a-box>

    <!-- ============ ΤΟΙΧΟΣ ΤΟΥ ΔΙΔΑΣΚΟΝΤΑ ============ -->
    <!-- Πανί προβολής -->
    <a-plane material="src: #texProjector; repeat: 3 2; roughness: 1" position="0.7 1.75 -2.99" width="2.2" height="1.4"></a-plane>
    <!-- Πινακίδα αίθουσας -->
    <a-plane mixin="m-sign" position="-1.72 1.9 -2.98" width="0.4" height="0.2"></a-plane>
    <!-- Αφίσες στον αριστερό τοίχο -->
    <a-plane mixin="m-poster" position="-3.49 1.72 -0.5" rotation="0 90 0" width="0.42" height="0.6"></a-plane>
    <a-plane mixin="m-poster2" position="-3.49 1.72 0.7" rotation="0 90 0" width="0.42" height="0.6"></a-plane>
    <!-- Πίνακας διακοπτών και κανάλι καλωδίων στη βάση του τοίχου -->
    <a-box material="color: #c8c4ba; roughness: 0.7" position="2.7 1.5 -2.94" width="0.3" height="0.3" depth="0.06"></a-box>
    <a-box material="color: #cdc9c0" position="0.6 0.12 -2.95" width="5.8" height="0.1" depth="0.08"></a-box>

    <!-- Φωτιστικά οροφής (τα σώματα· τα φώτα είναι πιο πάνω) -->
    <a-box mixin="m-lamp" position="-1.7 2.83 -1.2" width="0.26" height="0.07" depth="1.3"></a-box>
    <a-box mixin="m-lamp" position="-1.7 2.83 1.1" width="0.26" height="0.07" depth="1.3"></a-box>
    <a-box mixin="m-lamp" position="0.5 2.83 -1.2" width="0.26" height="0.07" depth="1.3"></a-box>
    <a-box mixin="m-lamp" position="0.5 2.83 1.1" width="0.26" height="0.07" depth="1.3"></a-box>
    <a-box mixin="m-lamp" position="2.4 2.83 -1.2" width="0.26" height="0.07" depth="1.3"></a-box>
    <a-box mixin="m-lamp" position="2.4 2.83 1.1" width="0.26" height="0.07" depth="1.3"></a-box>

    <!-- Προβολέας οροφής. Ο κώνος είναι διαφανής και δείχνει τη δέσμη. -->
    <a-cylinder mixin="m-metal" position="0.7 2.74 -1.3" radius="0.03" height="0.32"></a-cylinder>
    <a-box mixin="m-metal" position="0.7 2.57 -1.3" width="0.28" height="0.03" depth="0.22"></a-box>
    <a-box mixin="m-white" position="0.7 2.48 -1.3" width="0.32" height="0.15" depth="0.28" shadow="cast: true"></a-box>
    <a-cone id="beam-cone" position="0.7 2.1 -2.14" rotation="-112.6 0 0"
            radius-top="1.06" radius-bottom="0.07" height="1.82" open-ended="true"
            material="color: #eaf3ff; opacity: 0.07; transparent: true; shader: flat; side: double; depthWrite: false"></a-cone>
    <a-cylinder mixin="m-plastic" position="0.7 2.48 -1.45" rotation="90 0 0" radius="0.045" height="0.04"></a-cylinder>

    <!-- ============ ΠΑΓΚΟΙ ΣΕ ΔΙΑΤΑΞΗ Π ============ -->
    <!-- Κάθε θέση εργασίας έχει το ίδιο περιεχόμενο (οθόνη, πληκτρολόγιο,
         ποντίκι, πύργος) και μια καρέκλα, οπότε τα φτιάχνει το component
         "workstation" / "chair". Εδώ μένουν μόνο η θέση, η στροφή και η
         εικόνα της οθόνης. -->

    <!-- ---- Αριστερό σκέλος ---- -->
    <a-box mixin="m-desk-z" position="-3.1 0.74 -0.2" width="0.75" height="0.05" depth="4.8" shadow="cast: true; receive: true"></a-box>
    <a-box mixin="m-metal" position="-3.1 0.4 -2.5" width="0.7" height="0.68" depth="0.05"></a-box>
    <a-box mixin="m-metal" position="-3.1 0.4 -0.2" width="0.7" height="0.68" depth="0.05"></a-box>
    <a-box mixin="m-metal" position="-3.1 0.4 2.1" width="0.7" height="0.68" depth="0.05"></a-box>
    <a-box mixin="m-metal" position="-3.1 0.68 -0.2" width="0.06" height="0.06" depth="4.7"></a-box>

    <a-entity workstation position="-3.1 0 -2.3" rotation="0 90 0">
      <a-plane mixin="m-code" position="0 1.08 -0.12" width="0.51" height="0.3"></a-plane>
      <a-entity chair position="0 0 0.78"></a-entity>
    </a-entity>
    <a-entity workstation position="-3.1 0 -1.15" rotation="0 90 0">
      <a-plane mixin="m-photo" position="0 1.08 -0.12" width="0.51" height="0.3"></a-plane>
      <a-entity chair position="0 0 0.8" rotation="0 -14 0"></a-entity>
    </a-entity>
    <a-entity workstation position="-3.1 0 0" rotation="0 90 0">
      <a-plane mixin="m-screen" position="0 1.08 -0.12" width="0.51" height="0.3"></a-plane>
      <a-entity chair position="0 0 0.78"></a-entity>
    </a-entity>
    <a-entity workstation position="-3.1 0 1.15" rotation="0 90 0">
      <a-plane mixin="m-code" position="0 1.08 -0.12" width="0.51" height="0.3"></a-plane>
      <a-entity chair position="0 0 0.82" rotation="0 18 0"></a-entity>
    </a-entity>

    <!-- ---- Πίσω σκέλος ---- -->
    <a-box mixin="m-desk-x" position="0.38 0.74 2.6" width="6.15" height="0.05" depth="0.75" shadow="cast: true; receive: true"></a-box>
