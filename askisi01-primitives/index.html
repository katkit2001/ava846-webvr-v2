<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Άσκηση 01 — ΥΚ1, Κτίριο Γ΄ | 3Δ σκηνή με primitives</title>
  <meta name="description" content="Αναπαράσταση του ΥΚ1 (Κτίριο Γ΄, Τμήμα Τεχνών Ήχου και Εικόνας, Ιόνιο Πανεπιστήμιο) με primitives σε A-Frame. Διάταξη πάγκων σε Π.">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="js/scene.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="hud">
    <b>ΥΚ1 · Κτίριο Γ΄</b>
    <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> μετακίνηση<br>
    Ποντίκι / drag: περιστροφή βλέμματος<br>
    Κουμπί <kbd>VR</kbd> κάτω δεξιά για προβολή σε headset
  </div>

           shadow="type: pcf"
           renderer="antialias: true; colorManagement: true; toneMapping: ACESFilmic; exposure: 0.85">

      <a-mixin id="m-wall"      material="color: #d6d2c8; roughness: 0.95; metalness: 0"></a-mixin>
      <a-mixin id="m-skirt"     material="color: #ada695; roughness: 0.7"></a-mixin>
      <a-mixin id="m-floor"     material="color: #a79e88; roughness: 0.45; metalness: 0.1"></a-mixin>
      <a-mixin id="m-ceiling"   material="color: #eae7e0; roughness: 1"></a-mixin>
      <a-mixin id="m-desk"      material="color: #cec3a9; roughness: 0.7"></a-mixin>
      <a-mixin id="m-wood"      material="color: #bb9459; roughness: 0.8"></a-mixin>
      <a-mixin id="m-metal"     material="color: #79818b; roughness: 0.4; metalness: 0.7"></a-mixin>
      <a-mixin id="m-tube"      material="color: #23262a; roughness: 0.45; metalness: 0.6"></a-mixin>
      <a-mixin id="m-plastic"   material="color: #26292e; roughness: 0.6"></a-mixin>

      <a-mixin id="m-chair"     material="color: #1c1f24; roughness: 0.85"></a-mixin>
      <a-mixin id="m-curtain"   material="color: #c7aa76; roughness: 1"></a-mixin>
      <a-mixin id="m-glass"     material="color: #dfeef7; opacity: 0.3; transparent: true; roughness: 0.05; metalness: 0.2"></a-mixin>
      <a-mixin id="m-frame"     material="color: #bcc3c9; roughness: 0.45; metalness: 0.25"></a-mixin>
      <a-mixin id="m-door"      material="color: #1f3b31; roughness: 0.5"></a-mixin>
      <a-mixin id="m-doorpane"  material="color: #cfd9dd; roughness: 0.15; metalness: 0.1"></a-mixin>
      <a-mixin id="m-handle"    material="color: #b08a3e; roughness: 0.35; metalness: 0.8"></a-mixin>
      <a-mixin id="m-white"     material="color: #ebe9e3; roughness: 0.22; metalness: 0.05"></a-mixin>
